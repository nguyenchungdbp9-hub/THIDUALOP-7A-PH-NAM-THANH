    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Hiệu ứng nổi 3D (Floating) tự động cho cây */
        @keyframes float3D {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .tree-3d-tot {
            animation: float3D 3s ease-in-out infinite;
            filter: drop-shadow(0 15px 10px rgba(220, 38, 38, 0.4)) brightness(1.1);
        }
        .tree-3d-kha {
            animation: float3D 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 8px rgba(202, 138, 4, 0.3));
        }
        .tree-3d-dat {
            animation: float3D 5s ease-in-out infinite;
            filter: drop-shadow(0 5px 5px rgba(22, 163, 74, 0.2));
        }
        .tree-3d-truot {
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1)) grayscale(0.8);
        }

        /* Ẩn thanh cuộn nhưng vẫn cho phép cuộn */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

        ];

        // --- HELPER FUNCTIONS ---
        const getRanking = (score, plus, minus) => {
            let label = 'Chưa đạt'; let color = 'text-stone-600'; let bg = 'bg-stone-100 border-stone-300';
            if (score >= 90) { label = 'Tốt'; color = 'text-red-700'; bg = 'bg-red-50 border-red-200'; }
            else if (score >= 75) { label = 'Khá'; color = 'text-yellow-700'; bg = 'bg-yellow-50 border-yellow-200'; }
            else if (score >= 60) { label = 'Trung bình'; color = 'text-green-700'; bg = 'bg-green-50 border-green-200'; }

            let tree = '🌱';
            let treeClass = 'text-3xl tree-3d-dat transform hover:scale-110 transition-all duration-300';
            
            if (plus === 0 && minus === 0) {
                tree = '🌱';
                treeClass = 'text-3xl tree-3d-dat transform hover:scale-110 transition-all duration-300 opacity-90';
            } else if (score > 100) {
                if (score >= 115) {
                    tree = '🌳🍎';
                    treeClass = 'text-5xl tree-3d-tot transform hover:scale-150 transition-all duration-300 z-10 relative';
                } else if (score >= 107) {
                    tree = '🌳🌸';
                    treeClass = 'text-4xl tree-3d-kha transform hover:scale-125 transition-all duration-300 relative';
                } else {
                    tree = '🌳🌿';
                    treeClass = 'text-4xl tree-3d-dat transform hover:scale-110 transition-all duration-300';
                }
            } else if (score < 100) {
                if (score >= 90) {
                    tree = '🥀';
                    treeClass = 'text-3xl tree-3d-truot opacity-80 transform hover:rotate-6 transition-all duration-300';
                } else if (score >= 75) {
                    tree = '🍂';
                    treeClass = 'text-3xl tree-3d-truot opacity-60 transform hover:-rotate-12 transition-all duration-300';
                } else {
                    tree = '🪵🐛';
                    treeClass = 'text-2xl tree-3d-truot opacity-50 transform hover:rotate-12 transition-all duration-500 grayscale';
                }
            } else {
                tree = '🌿'; 
                treeClass = 'text-3xl tree-3d-dat transform hover:scale-110 transition-all duration-300';
            }

            return { label, color, bg, tree, treeClass };
        };

        const getCriterionStr = (id) => {
            const c = criteriaList.find(x => x.id === id);
            return c ? `${c.name} (${c.point > 0 ? '+' : ''}${c.point})` : 'Không xác định';
        };

        const getScoreForPeriod = (student, filterVal, isWeek, confirmedIncidents) => {
            let score = 100;
            let plus = 0;
            let minus = 0;
            let phoneViolations = 0;

            let periodIncidents = [];
            if (isWeek) {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                periodIncidents = confirmedIncidents.filter(i => new Date(i.date) >= weekAgo);
            } else {
                periodIncidents = confirmedIncidents.filter(i => i.date.startsWith(filterVal));
            }

            const personal = periodIncidents.filter(i => i.studentId === student.id);
            personal.forEach(inc => {
                if (inc.point > 0) plus += inc.point;
                else minus += Math.abs(inc.point);
                if (inc.criteriaId === 14) phoneViolations++;
            });

            const groupIncidents = periodIncidents.filter(i => i.criteriaId === 23 && i.groupId === student.group);
            groupIncidents.forEach(inc => {
                minus += Math.abs(inc.point);
            });

            score = score + plus - minus;
            return { score, plus, minus, phoneViolations };
        };

        // --- MAIN APP COMPONENT ---

        function ReportView({ incidents, students }) {
            const today = new Date();
            const currentMonthStr = today.toISOString().substring(0, 7);
            const [filterType, setFilterType] = useState('month');
            const [selectedMonth, setSelectedMonth] = useState(currentMonthStr);

            const availableMonths = useMemo(() => {
                const months = new Set(incidents.map(i => i.date.substring(0, 7)));
                months.add(currentMonthStr);
                return Array.from(months).sort().reverse();
            }, [incidents, currentMonthStr]);

            const calculateScores = () => {
                const confirmedIncidents = incidents.filter(i => i.status === 'confirmed');
                
                let report = students.map(st => {
                    const data = getScoreForPeriod(st, selectedMonth, filterType === 'week', confirmedIncidents);
                    
                    let prevData = { score: 100 }; 
                    if (filterType === 'month') {
                        const [year, month] = selectedMonth.split('-');
                        const prevDate = new Date(year, parseInt(month) - 2, 1);
                        const prevMonthStr = prevDate.toISOString().substring(0, 7);
                        prevData = getScoreForPeriod(st, prevMonthStr, false, confirmedIncidents);
                    }

                    let trendVal = data.score - prevData.score;
                    let trendText = "Giữ phong độ";
                    let trendColor = "text-gray-500";
                    if (trendVal > 0) {
                        trendText = `Tiến bộ (+${trendVal})`;
                        trendColor = "text-green-600";
                    } else if (trendVal < 0) {
                        trendText = `Sa sút (${trendVal})`;
                        trendColor = "text-red-600";
                    }

                    return {
                        ...st, ...data, rank: getRanking(data.score, data.plus, data.minus),
                        trendText, trendVal, trendColor
                    };
                });

                report.sort((a, b) => b.score - a.score);

                let currentRank = 1;
                let previousScore = null;
                report.forEach((st, idx) => {
                    if (previousScore !== null && st.score < previousScore) {
                        currentRank = idx + 1;
                    }
                    st.position = currentRank;
                    previousScore = st.score;
                });

                return report;
            };

            const reportData = calculateScores();

            const handleExportExcel = () => {
                const headers = ['Hang', 'STT', 'Ho va ten', 'To', 'Diem cong', 'Diem tru', 'Loi dien thoai', 'Tong diem', 'Xep loai', 'Thu hoach (Cay)', 'Nhan xet'];
                const rows = reportData.map((st, idx) => [
                    st.position,
                    idx + 1,
                    `"${st.name}"`, 
                    st.group,
                    st.plus,
                    st.minus,
                    st.phoneViolations,
                    st.score,
                    `"${st.rank.label}"`,
                    `"${st.rank.tree}"`,
                    `"${st.trendText}"`
                ]);
                
                const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Bang_Diem_Thi_Dua_${filterType === 'month' ? selectedMonth : 'Tuan'}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="animate-in fade-in duration-300">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 className="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-gray-800 to-gray-600">Bảng Tổng Kết Điểm Thi Đua</h2>
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="bg-gray-100/80 backdrop-blur-sm p-1.5 rounded-xl inline-flex shadow-inner">
                                <button 
                                    onClick={() => setFilterType('week')}
                                    className={`px-4 py-2 rounded-lg font-bold text-sm transition ${filterType === 'week' ? 'bg-white shadow-sm text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    7 ngày qua
                                </button>
                                <button 
                                    onClick={() => setFilterType('month')}
                                    className={`px-4 py-2 rounded-lg font-bold text-sm transition ${filterType === 'month' ? 'bg-white shadow-sm text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    Theo tháng
                                </button>
                            </div>

                            {filterType === 'month' && (
                                <div className="flex items-center bg-white border border-gray-200 rounded-xl px-3 py-1.5 shadow-sm">
                                    <Calendar className="w-4 h-4 text-gray-400 mr-2" />
                                    <select 
                                        value={selectedMonth} 
                                        onChange={e => setSelectedMonth(e.target.value)}
                                        className="bg-transparent font-bold text-gray-700 outline-none cursor-pointer text-sm"
                                    >
                                        {availableMonths.map(m => (
                                            <option key={m} value={m}>Tháng {m.split('-')[1]}/{m.split('-')[0]}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            <button 
                                onClick={handleExportExcel}
                                className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold transition-all shadow-sm hover:shadow-md transform hover:-translate-y-0.5"
                            >
                                <Download className="w-4 h-4"/> Xuất Excel
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto rounded-2xl border border-gray-100 shadow-lg bg-white">
                        <table className="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr className="bg-gradient-to-r from-slate-50 to-gray-50 border-b border-gray-200 text-sm text-gray-600 uppercase tracking-wider">
                                    <th className="p-4 font-bold text-center w-12 text-blue-600">Hạng</th>
                                    <th className="p-4 font-bold text-center w-12">STT</th>
                                    <th className="p-4 font-bold">Họ và tên</th>
                                    <th className="p-4 font-bold text-center">Tổ</th>
                                    <th className="p-4 font-bold text-center text-emerald-600">Cộng</th>
                                    <th className="p-4 font-bold text-center text-rose-600">Trừ</th>
                                    <th className="p-4 font-bold text-center">Tổng điểm</th>
                                    <th className="p-4 font-bold">Xếp loại</th>
                                    <th className="p-4 font-bold text-center text-green-600">Cây thành quả</th>
                                    <th className="p-4 font-bold">Nhận xét</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {reportData.map((st, idx) => (
                                    <tr key={st.id} className="hover:bg-blue-50/50 transition-colors duration-200 group">
                                        <td className="p-4 text-center font-extrabold text-lg text-blue-600">
                                            {st.position === 1 ? '🥇' : st.position === 2 ? '🥈' : st.position === 3 ? '🥉' : st.position}
                                        </td>
                                        <td className="p-4 text-center text-gray-400 font-semibold group-hover:text-blue-500">{idx + 1}</td>
                                        <td className="p-4 font-bold text-gray-800">
                                            {st.name}
                                            {st.title && <span className="ml-2 text-xs bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-700 px-2 py-0.5 rounded-full font-bold shadow-sm">{st.title}</span>}
                                            {st.phoneViolations > 0 && (
                                                <span title="Vi phạm điện thoại" className="ml-2 inline-flex items-center text-xs text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded-full font-semibold border border-rose-100">
                                                    <Smartphone className="w-3 h-3 mr-1"/> x{st.phoneViolations}
                                                </span>
                                            )}
                                        </td>
                                        <td className="p-4 text-center text-gray-600 font-medium">{st.group}</td>
                                        <td className="p-4 text-center font-bold text-emerald-600 bg-emerald-50/30">{st.plus > 0 ? `+${st.plus}` : '-'}</td>
                                        <td className="p-4 text-center font-bold text-rose-600 bg-rose-50/30">{st.minus > 0 ? `-${st.minus}` : '-'}</td>
                                        <td className="p-4 text-center font-extrabold text-lg text-gray-800 bg-gray-50/50">{st.score}</td>
                                        <td className="p-4">

                                            </span>
                                        </td>
                                        <td className="p-4 text-center">
                                            <div className={`inline-block cursor-help ${st.rank.treeClass}`} title={`Hạt mầm -> Ra lá -> Đậu quả: ${st.rank.label}`}>
                                                {st.rank.tree}
                                            </div>
                                        </td>
                                        <td className="p-4">
                                            <div className={`flex items-center gap-1.5 text-sm font-bold ${st.trendColor}`}>
                                                {st.trendVal > 0 ? <TrendingUp className="w-4 h-4" /> : st.trendVal < 0 ? <TrendingDown className="w-4 h-4" /> : <Minus className="w-4 h-4" />}
                                                {st.trendText}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function SettingsView({ currentPassword, onUpdatePassword }) {
            const [oldPass, setOldPass] = useState('');
            const [newPass, setNewPass] = useState('');
            const [confirmPass, setConfirmPass] = useState('');
            const [msg, setMsg] = useState({ text: '', type: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (oldPass !== currentPassword) {
                    setMsg({ text: 'Mật khẩu hiện tại không đúng!', type: 'error' });
                    return;
                }
                if (newPass.length < 6) {
                    setMsg({ text: 'Mật khẩu mới phải có ít nhất 6 ký tự!', type: 'error' });
                    return;
                }
                if (newPass !== confirmPass) {
                    setMsg({ text: 'Xác nhận mật khẩu không khớp!', type: 'error' });
                    return;
                }
                onUpdatePassword(newPass);
                setMsg({ text: 'Đổi mật khẩu thành công!', type: 'success' });
                setOldPass(''); setNewPass(''); setConfirmPass('');
            };

            return (
                <div className="animate-in fade-in duration-300 h-full flex flex-col items-center justify-center py-10">
                    <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                        <h2 className="text-2xl font-bold mb-6 flex items-center justify-center gap-3 text-gray-800 border-b border-gray-100 pb-4">
                            <Key className="text-blue-600 w-7 h-7" /> Đổi mật khẩu GVCN
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Mật khẩu hiện tại</label>
                                <input
                                    type="password" required value={oldPass} onChange={e => setOldPass(e.target.value)}
                                    className="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition shadow-sm text-center font-bold tracking-wider"
                                    placeholder="••••••"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Mật khẩu mới</label>
                                <input
                                    type="password" required value={newPass} onChange={e => setNewPass(e.target.value)}
                                    className="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition shadow-sm text-center font-bold tracking-wider"
                                    placeholder="Nhập ít nhất 6 ký tự"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Xác nhận mật khẩu mới</label>
                                <input
                                    type="password" required value={confirmPass} onChange={e => setConfirmPass(e.target.value)}
                                    className="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition shadow-sm text-center font-bold tracking-wider"
                                    placeholder="Nhập lại mật khẩu mới"
                                />
                            </div>
                            {msg.text && (
                                <div className={`p-3 rounded-xl text-sm font-bold text-center border ${msg.type === 'error' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                                    {msg.text}
                                </div>
                            )}
                            <button type="submit" className="w-full bg-gradient-to-r from-gray-800 to-gray-900 text-white font-bold py-3.5 rounded-xl hover:from-black hover:to-gray-800 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5 mt-2">
                                Lưu Mật Khẩu
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
